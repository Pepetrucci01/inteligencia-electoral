<script src="theme.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   GUARD — defensa en profundidad ademas del ocultado del hub.
   A diferencia de otros modulos, aqui entran LOS 9 ROLES: si
   alguien no puede usar el sistema, tiene que poder decirlo.
   ════════════════════════════════════════════════════════════ */
(function guardSoporte(){
  try {
    const s = JSON.parse(localStorage.getItem('electoral_sesion') || 'null');
    if (!s || !s.ts) { window.location.replace('login.html'); return; }
    if ((Date.now() - s.ts) / 3600000 >= 8) { localStorage.removeItem('electoral_sesion'); window.location.replace('login.html'); return; }
    const rolesPermitidos = ['super_admin','admin','coordinador_estatal','coordinador',
                             'jefe_seccion','capturista','operador_cc','repr_casilla','consulta'];
    if (!rolesPermitidos.includes(s.rol)) { window.location.replace('login.html'); return; }
    window._sesion = s;
  } catch(e) { window.location.replace('login.html'); }
})();

const SUPA_URL = 'https://dyirhwwmykskpuvzcafx.supabase.co';

/* ════════════════════════════════════════════════════════════
   BUFFER DE ERRORES DE CONSOLA
   Se envuelve console.error para quedarnos con los ultimos 8.
   Es lo que hace util un ticket: sin esto, el reporte dice
   "no funciona" y el diagnostico son dos dias de ida y vuelta.
   Va aqui y NO en theme.js a proposito: theme.js lo cargan los
   9 modulos y no quiero tocar un archivo compartido por esto.
   El precio es que solo captura los errores de ESTE modulo; los
   del modulo donde ocurrio el problema no viajan. Se resuelve
   despues moviendolo a theme.js, si se decide que vale la pena.
   ════════════════════════════════════════════════════════════ */
const _errBuffer = [];
(function capturarErrores(){
  const orig = console.error;
  console.error = function(){
    try {
      _errBuffer.push(Array.from(arguments).map(a =>
        (a && a.message) ? a.message : String(a)).join(' ').slice(0,240));
      if (_errBuffer.length > 8) _errBuffer.shift();
    } catch(e) {}
    orig.apply(console, arguments);
  };
  window.addEventListener('error', ev => {
    try {
      _errBuffer.push('window.onerror: ' + (ev.message||'') + ' @' + (ev.filename||'').split('/').pop() + ':' + (ev.lineno||''));
      if (_errBuffer.length > 8) _errBuffer.shift();
    } catch(e) {}
  });
  window.addEventListener('unhandledrejection', ev => {
    try {
      _errBuffer.push('promesa sin catch: ' + String(ev.reason && ev.reason.message || ev.reason).slice(0,200));
      if (_errBuffer.length > 8) _errBuffer.shift();
    } catch(e) {}
  });
})();

function armarContexto(){
  const s = window._sesion || {};
  return {
    // El hub carga los modulos como iframe con ?v=<APP_BUILD>, asi que el
    // build viaja en la propia URL. NO se lee window.parent.APP_BUILD: alla
    // esta declarado con `const` en el ambito del script, y un const de nivel
    // superior NO se convierte en propiedad de window — daba "desconocido".
    build:        new URLSearchParams(location.search).get('v') || 'desconocido',
    modulo_origen: (function(){ try { return window.parent.location.hash || 'hub'; } catch(e){ return 'iframe'; } })(),
    rol:          s.rol || null,
    licencia_id:  s.licencia_id || null,
    municipio:    s.municipio || null,
    seccion:      s.seccion || null,
    online:       navigator.onLine,
    user_agent:   navigator.userAgent.slice(0,220),
    pantalla:     window.screen.width + 'x' + window.screen.height,
    idioma:       navigator.language,
    ts_cliente:   new Date().toISOString(),
    errores:      _errBuffer.slice()
  };
}

function pintarContexto(){
  const c = armarContexto();
  const el = document.getElementById('f-ctx');
  el.textContent =
    'build ' + c.build + ' · rol ' + (c.rol||'—') +
    ' · ' + (c.online ? 'con conexión' : 'SIN CONEXIÓN') +
    ' · pantalla ' + c.pantalla +
    (c.errores.length ? ' · ' + c.errores.length + ' error(es) técnico(s) recientes'
                      : ' · sin errores recientes');
}

/* ── Utilidades ─────────────────────────────────────────── */
function escHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function mostrar(id, texto, ms){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = texto;
  el.style.display = 'block';
  if (ms) setTimeout(()=>{ el.style.display='none'; }, ms);
}
function ocultar(id){ const el=document.getElementById(id); if(el) el.style.display='none'; }
function cerrarSesion(){ localStorage.removeItem('electoral_sesion'); window.location.href='login.html'; }

const ETIQ_ESTADO = {
  nuevo:'Nuevo', asignado:'Asignado', en_proceso:'En proceso',
  esperando_cliente:'Esperando tu respuesta', resuelto:'Resuelto',
  cerrado:'Cerrado', reabierto:'Reabierto'
};

// Solo las dos urgentes llevan etiqueta. Baja y media no necesitan gritar.
const ETIQ_URGENCIA = { critica:'● URGENTE', alta:'● ALTA' };

/* ── Llamadas a la API (siempre via supaFetch de theme.js: es la
      fuente unica de token y quien reintenta tras un 401) ───── */
async function rpc(nombre, cuerpo){
  const r = await supaFetch(SUPA_URL + '/rest/v1/rpc/' + nombre, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(cuerpo || {})
  });
  const txt = await r.text();
  if (!r.ok) {
    let msg = txt;
    try { msg = JSON.parse(txt).message || txt; } catch(e){}
    throw new Error(msg);
  }
  try { return JSON.parse(txt); } catch(e){ return null; }
}

async function api(ruta){
  const r = await supaFetch(SUPA_URL + '/rest/v1/' + ruta);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' al leer ' + ruta.split('?')[0]);
  return await r.json();
}

/* ── Navegación ─────────────────────────────────────────── */
function verTab(cual){
  document.getElementById('v-nuevo').classList.toggle('oculto', cual!=='nuevo');
  document.getElementById('v-mis').classList.toggle('oculto', cual!=='mis');
  document.getElementById('v-detalle').classList.add('oculto');
  document.getElementById('tab-nuevo').classList.toggle('active', cual==='nuevo');
  document.getElementById('tab-mis').classList.toggle('active', cual==='mis');
  if (cual==='nuevo') pintarContexto();
  if (cual==='mis')   cargarTickets();
}

/* ── Crear ticket ───────────────────────────────────────── */
async function enviarTicket(){
  ocultar('nv-err'); ocultar('nv-ok');
  const asunto = document.getElementById('f-asunto').value.trim();
  const desc   = document.getElementById('f-descripcion').value.trim();

  if (asunto.length < 5)  { mostrar('nv-err','El asunto necesita al menos 5 caracteres.'); return; }
  if (desc.length   < 10) { mostrar('nv-err','Cuéntanos un poco más de lo que pasó (mínimo 10 caracteres).'); return; }

  const archivo = document.getElementById('f-archivo').files[0] || null;
  if (archivo && archivo.size > 5242880) {
    mostrar('nv-err','El archivo pesa más de 5 MB. Recorta la captura e inténtalo de nuevo.');
    return;
  }

  const btn = document.getElementById('btn-enviar');
  if (btn.disabled) return;                 // candado anti-doble-clic
  btn.disabled = true; btn.textContent = 'Enviando…';

  try {
    const res = await rpc('crear_ticket', {
      p_asunto: asunto,
      p_descripcion: desc,
      p_categoria: document.getElementById('f-categoria').value,
      p_prioridad: document.getElementById('f-prioridad').value,
      p_contexto: armarContexto()
    });

    // El adjunto es SECUNDARIO: si falla, el ticket ya existe y no se pierde.
    let avisoAdj = '';
    if (archivo && res && res.id) {
      try { await subirAdjunto(res.id, archivo); }
      catch(e) {
        console.error('adjunto:', e.message);
        avisoAdj = ' (la captura no se pudo subir; puedes adjuntarla respondiendo al ticket)';
      }
    }

    // La UI solo avanza DESPUES del exito confirmado.
    document.getElementById('f-asunto').value = '';
    document.getElementById('f-descripcion').value = '';
    document.getElementById('f-archivo').value = '';
    mostrar('nv-ok','Ticket ' + (res && res.folio ? res.folio : '') +
                    ' registrado. Te responderemos en este mismo módulo.' + avisoAdj);
  } catch(e) {
    mostrar('nv-err','No se pudo registrar el ticket: ' + e.message +
                     '. Si no hay conexión, inténtalo cuando vuelva la señal.');
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar ticket';
  }
}

/* La ruta {ticket_id}/{archivo} NO es cosmetica: de ahi sale el permiso
   en la politica del bucket. Con otra forma, Storage lo rechaza. */
async function subirAdjunto(ticketId, archivo){
  const limpio = archivo.name.replace(/[^\w.\-]/g,'_').slice(-80);
  const ruta   = ticketId + '/' + Date.now() + '-' + limpio;

  const r = await supaFetch(SUPA_URL + '/storage/v1/object/ticket-adjuntos/' + ruta, {
    method:'POST',
    headers:{'Content-Type': archivo.type || 'application/octet-stream'},
    body: archivo
  });
  if (!r.ok) throw new Error('Storage HTTP ' + r.status);

  const r2 = await supaFetch(SUPA_URL + '/rest/v1/ticket_adjuntos', {
    method:'POST',
    headers:{'Content-Type':'application/json','Prefer':'return=minimal'},
    body: JSON.stringify({
      ticket_id: ticketId, storage_path: ruta, nombre_archivo: archivo.name,
      mime: archivo.type || null, tamano_bytes: archivo.size,
      subido_por: window._sesion.id
    })
  });
  if (!r2.ok) throw new Error('registro del adjunto HTTP ' + r2.status);
}

/* ── Lista ──────────────────────────────────────────────── */
async function cargarTickets(){
  ocultar('ls-err');
  const cont = document.getElementById('ls-cont');
  cont.innerHTML = '<div class="cargando">Cargando tickets…</div>';
  try {
    const filas = await api('tickets?select=id,folio,asunto,estado,prioridad,categoria,created_at,actualizado_at&order=created_at.desc&limit=100');
    if (!filas.length) {
      cont.innerHTML = '<div class="vacio">Todavía no has levantado ningún ticket.</div>';
      return;
    }
    cont.innerHTML = filas.map(t =>
      '<div class="tk p-' + escHtml(t.prioridad) + '" onclick="verDetalle(\'' + t.id + '\')">' +
        '<div class="tk-top">' +
          '<span class="tk-folio">' + escHtml(t.folio) + '</span>' +
          '<span class="pill e-' + escHtml(t.estado) + '">' + escHtml(ETIQ_ESTADO[t.estado] || t.estado) + '</span>' +
        '</div>' +
        '<div class="tk-asunto">' + escHtml(t.asunto) + '</div>' +
        '<div class="tk-meta">' +
          // La etiqueta de texto acompaña al color: quien no distingue rojo de
          // ambar tambien tiene que poder ordenar sus tickets.
          (ETIQ_URGENCIA[t.prioridad]
            ? '<span class="urg ' + escHtml(t.prioridad) + '">' + ETIQ_URGENCIA[t.prioridad] + '</span>' : '') +
          new Date(t.created_at).toLocaleString('es-MX') +
          ' · ' + escHtml(t.categoria) + '</div>' +
      '</div>'
    ).join('');
  } catch(e) {
    cont.innerHTML = '';
    mostrar('ls-err','No se pudieron cargar tus tickets: ' + e.message);
  }
}

/* ── Detalle / hilo ─────────────────────────────────────── */
let _ticketActual = null;

async function verDetalle(id){
  ocultar('dt-err');
  document.getElementById('v-nuevo').classList.add('oculto');
  document.getElementById('v-mis').classList.add('oculto');
  document.getElementById('v-detalle').classList.remove('oculto');
  document.getElementById('dt-cab').innerHTML = '<div class="cargando">Cargando…</div>';
  document.getElementById('dt-hilo').innerHTML = '';
  _ticketActual = id;

  try {
    const t = (await api('tickets?id=eq.' + id + '&select=*'))[0];
    if (!t) throw new Error('ticket no encontrado');

    const reabrible = (t.estado === 'resuelto' || t.estado === 'cerrado');
    document.getElementById('dt-cab').innerHTML =
      '<div class="tk-top">' +
        '<span class="tk-folio">' + escHtml(t.folio) + '</span>' +
        '<span class="pill e-' + escHtml(t.estado) + '">' + escHtml(ETIQ_ESTADO[t.estado] || t.estado) + '</span>' +
      '</div>' +
      '<div class="tk-asunto">' + escHtml(t.asunto) + '</div>' +
      '<div class="tk-meta">Abierto el ' + new Date(t.created_at).toLocaleString('es-MX') +
        ' · ' + escHtml(t.categoria) + ' · prioridad ' + escHtml(t.prioridad) + '</div>' +
      (reabrible ? '<button class="btn ghost" style="margin-top:11px;" onclick="reabrir()">↻ Reabrir ticket</button>' : '');

    // Si esta cerrado o resuelto, no se responde: se reabre.
    document.getElementById('dt-responder').classList.toggle('oculto', reabrible);

    const msgs = await api('ticket_mensajes?ticket_id=eq.' + id + '&select=*&order=created_at.asc');
    document.getElementById('dt-hilo').innerHTML = msgs.map(m =>
      '<div class="msg ' + (m.autor_tipo === 'soporte' ? 'soporte' : 'cliente') + '">' +
        '<div class="msg-head">' +
          (m.autor_tipo === 'soporte' ? '🛠 Soporte' : '👤 ' + escHtml(m.autor_nombre || 'Tú')) +
          ' · ' + new Date(m.created_at).toLocaleString('es-MX') +
        '</div>' + escHtml(m.cuerpo) +
      '</div>'
    ).join('');

    const adj = await api('ticket_adjuntos?ticket_id=eq.' + id + '&select=nombre_archivo,storage_path');
    if (adj.length) {
      document.getElementById('dt-hilo').insertAdjacentHTML('beforeend',
        '<div class="card"><label class="lbl">Adjuntos</label>' +
        adj.map(a => '<div class="adj">📎 ' + escHtml(a.nombre_archivo) + '</div>').join('') +
        '</div>');
    }
  } catch(e) {
    document.getElementById('dt-cab').innerHTML = '';
    mostrar('dt-err','No se pudo abrir el ticket: ' + e.message);
  }
}

async function responder(){
  ocultar('dt-err');
  const txt = document.getElementById('f-respuesta').value.trim();
  if (txt.length < 2) { mostrar('dt-err','Escribe tu respuesta antes de enviarla.'); return; }

  const btn = document.getElementById('btn-responder');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    await rpc('agregar_mensaje_ticket', { p_ticket_id: _ticketActual, p_cuerpo: txt, p_interno: false });
    document.getElementById('f-respuesta').value = '';   // solo tras el exito
    await verDetalle(_ticketActual);
  } catch(e) {
    mostrar('dt-err','No se pudo enviar tu respuesta: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Enviar respuesta';
  }
}

async function reabrir(){
  const motivo = prompt('¿Por qué necesitas reabrirlo? El equipo lo verá como primer mensaje.');
  if (!motivo || !motivo.trim()) return;
  try {
    await rpc('reabrir_ticket', { p_ticket_id: _ticketActual, p_motivo: motivo.trim() });
    await verDetalle(_ticketActual);
  } catch(e) {
    mostrar('dt-err','No se pudo reabrir: ' + e.message);
  }
}

/* ── Arranque ───────────────────────────────────────────── */
(function init(){
  const s = window._sesion || {};
  const ini = (s.nombre || '??').split(' ').map(p=>p[0]||'').join('').slice(0,2).toUpperCase();
  document.getElementById('tb-av').textContent = ini || '··';
  document.getElementById('tb-id').textContent =
    (s.nombre || 'Usuario') + ' · ' + (s.rol || '—') +
    (s.municipio ? ' · ' + s.municipio : '');
  pintarContexto();
})();
</script>
