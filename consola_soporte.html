<script>
/* ════════════════════════════════════════════════════════════
   Sin theme.js ni supabase_client.js: esta consola es
   independiente del lado del cliente. Solo la anon key, que es
   publica por diseño — todo el acceso lo decide la RLS.

   AMBIENTE: se detecta por dominio con el MISMO criterio que
   supabase_client.js (production SOLO si el host es exactamente
   uno de produccion; cualquier otra cosa cae a staging, que es
   el default seguro). Antes esto estaba escrito a mano apuntando
   a staging: el dia del despliegue a produccion, la consola
   habria seguido leyendo tickets de staging SIN AVISAR, y nadie
   lo habria notado hasta que un cliente reclamara que su ticket
   nunca fue atendido.
   ⚠️ Al dar de alta soporte.votera.mx hay que añadirlo A LAS DOS
      listas: aqui y en supabase_client.js.
   ════════════════════════════════════════════════════════════ */
const DOMINIOS_PRODUCCION = [
  'inteligencia-electoral.vercel.app',
  // 'votera.mx',
  // 'www.votera.mx',
  // 'soporte.votera.mx',
];
const _ES_PROD = DOMINIOS_PRODUCCION.includes(window.location.hostname);
const _CFG = {
  staging: {
    url: 'https://dyirhwwmykskpuvzcafx.supabase.co',
    key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5aXJod3dteWtza3B1dnpjYWZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NTk3ODgsImV4cCI6MjA5NTEzNTc4OH0.2xe4cHqORGng1hnYPJ9ZiyT0r87fMijbUEJqBy3-xoI'
  },
  production: {
    url: 'https://jawymbrpglddhhlizifk.supabase.co',
    key: 'sb_publishable_sFoiB-_SwBEONPhxg9-LnQ_0k2f2zzY'
  }
};
const ENV      = _ES_PROD ? 'production' : 'staging';
const SUPA_URL = _CFG[ENV].url;
const SUPA_KEY = _CFG[ENV].key;
// Que el agente SEPA a que base esta conectado: atender un ticket contra el
// ambiente equivocado es peor que no atenderlo.
console.log('Consola de soporte · ambiente: ' + ENV.toUpperCase() + ' · ' + SUPA_URL);
const SESION_KEY = 'votera_soporte_sesion_' + ENV;

let _ses = null;
let _ticketActual = null;

const ETIQ_ESTADO = {
  nuevo:'Nuevo', asignado:'Asignado', en_proceso:'En proceso',
  esperando_cliente:'Esperando cliente', resuelto:'Resuelto',
  cerrado:'Cerrado', reabierto:'REABIERTO'
};

function escHtml(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function mostrar(id, txt, ms){
  const el=document.getElementById(id); if(!el) return;
  el.textContent=txt; el.style.display='block';
  if(ms) setTimeout(()=>{el.style.display='none';}, ms);
}
function ocultar(id){ const el=document.getElementById(id); if(el) el.style.display='none'; }

/* ── Sesión y token ─────────────────────────────────────── */
function guardarSesion(s){ _ses = s; localStorage.setItem(SESION_KEY, JSON.stringify(s)); }
function leerSesion(){
  try { return JSON.parse(localStorage.getItem(SESION_KEY) || 'null'); } catch(e){ return null; }
}
function salir(){ localStorage.removeItem(SESION_KEY); location.reload(); }

// Refresco reactivo tras un 401, mismo criterio que supaFetch del cliente:
// el token de GoTrue vive una hora y una guardia de soporte dura mas.
async function refrescar(){
  if (!_ses || !_ses.refresh_token) return false;
  try {
    const r = await fetch(SUPA_URL + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({ refresh_token: _ses.refresh_token })
    });
    if (!r.ok) return false;
    const d = await r.json();
    if (!d.access_token) return false;
    _ses.access_token = d.access_token;
    _ses.refresh_token = d.refresh_token || _ses.refresh_token;
    guardarSesion(_ses);
    return true;
  } catch(e){ return false; }
}

async function sFetch(url, options){
  options = options || {};
  const armar = () => Object.assign({
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer ' + (_ses && _ses.access_token ? _ses.access_token : SUPA_KEY)
  }, options.headers || {});

  let r = await fetch(url, Object.assign({}, options, { headers: armar() }));
  if (r.status === 401) {
    const ok = await refrescar();
    if (ok) r = await fetch(url, Object.assign({}, options, { headers: armar() }));
  }
  return r;
}

async function api(ruta){
  const r = await sFetch(SUPA_URL + '/rest/v1/' + ruta);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return await r.json();
}
async function rpc(nombre, cuerpo){
  const r = await sFetch(SUPA_URL + '/rest/v1/rpc/' + nombre, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(cuerpo || {})
  });
  const txt = await r.text();
  if (!r.ok) {
    let m = txt; try { m = JSON.parse(txt).message || txt; } catch(e){}
    throw new Error(m);
  }
  try { return JSON.parse(txt); } catch(e){ return null; }
}

/* ── Login ──────────────────────────────────────────────── */
async function entrar(){
  ocultar('lg-err');
  const mail = document.getElementById('lg-mail').value.trim();
  const pass = document.getElementById('lg-pass').value;
  if (!mail || !pass) { mostrar('lg-err','Escribe tu correo y contraseña.'); return; }

  const btn = document.getElementById('btn-entrar');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const r = await fetch(SUPA_URL + '/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},
      body: JSON.stringify({ email: mail, password: pass })
    });
    const d = await r.json();
    if (!r.ok || !d.access_token) throw new Error(d.error_description || d.msg || 'credenciales inválidas');

    _ses = { access_token:d.access_token, refresh_token:d.refresh_token, email:mail, ts:Date.now() };

    // La cuenta existe, pero ¿es de soporte? Lo decide la BASE, no el cliente.
    const esSop = await rpc('es_soporte');
    if (esSop !== true) {
      _ses = null;
      throw new Error('esta cuenta no pertenece al equipo de soporte');
    }
    guardarSesion(_ses);
    await arrancarApp();
  } catch(e) {
    mostrar('lg-err','No se pudo entrar: ' + e.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function arrancarApp(){
  document.getElementById('v-login').classList.add('oculto');
  document.getElementById('v-app').classList.remove('oculto');
  try {
    const yo = await api('soporte_staff?select=nombre,nivel');
    const n = (yo && yo[0]) ? yo[0] : { nombre:_ses.email, nivel:'agente' };
    document.getElementById('tb-av').textContent =
      (n.nombre||'??').split(' ').map(p=>p[0]||'').join('').slice(0,2).toUpperCase();
    document.getElementById('tb-id').textContent = n.nombre + ' · ' + n.nivel;
  } catch(e){
    document.getElementById('tb-id').textContent = _ses.email;
  }
  await llenarPlazas();
  await cargarBandeja();
}

/* ── Bandeja ────────────────────────────────────────────── */
async function llenarPlazas(){
  try {
    const filas = await api('tickets?select=estado_republica');
    const set = Array.from(new Set(filas.map(f=>f.estado_republica).filter(Boolean))).sort();
    const sel = document.getElementById('f-plaza');
    sel.innerHTML = '<option value="">Todas</option>' +
      set.map(p=>'<option value="'+escHtml(p)+'">'+escHtml(p)+'</option>').join('');
  } catch(e) { /* si falla, el filtro se queda en "Todas" */ }
}

async function cargarBandeja(){
  ocultar('bd-err');
  const lista = document.getElementById('bd-lista');
  lista.innerHTML = '<div class="cargando">Cargando bandeja…</div>';

  const est   = document.getElementById('f-estado').value;
  const plaza = document.getElementById('f-plaza').value;
  const prio  = document.getElementById('f-prioridad').value;

  let q = 'tickets?select=*&limit=200';
  if (est === 'abiertos')      q += '&estado=neq.cerrado';
  else if (est)                q += '&estado=eq.' + encodeURIComponent(est);
  if (plaza)                   q += '&estado_republica=eq.' + encodeURIComponent(plaza);
  if (prio === 'sin')          q += '&prioridad_soporte=is.null';
  else if (prio)               q += '&prioridad_soporte=eq.' + encodeURIComponent(prio);
  // nullsfirst: lo sin clasificar es lo que primero hay que mirar.
  q += '&order=prioridad_soporte.asc.nullsfirst,created_at.asc';

  try {
    const filas = await api(q);
    pintarKpis(filas);
    if (!filas.length) { lista.innerHTML = '<div class="vacio">No hay tickets con esos filtros.</div>'; return; }
    lista.innerHTML = filas.map(t => tarjeta(t)).join('');
  } catch(e) {
    lista.innerHTML = '';
    mostrar('bd-err','No se pudo cargar la bandeja: ' + e.message);
  }
}

function pintarKpis(filas){
  const sinClas = filas.filter(t=>!t.prioridad_soporte).length;
  const nuevos  = filas.filter(t=>t.estado==='nuevo').length;
  const criticos= filas.filter(t=>t.prioridad_soporte==='critica').length;
  const espera  = filas.filter(t=>t.estado==='esperando_cliente').length;
  document.getElementById('bd-kpis').innerHTML =
    kpi(filas.length,'en la vista','') +
    kpi(sinClas,'sin clasificar', sinClas ? 'var(--purple)' : '') +
    kpi(nuevos,'nuevos', nuevos ? 'var(--accent)' : '') +
    kpi(criticos,'críticos', criticos ? 'var(--red)' : '') +
    kpi(espera,'esperando cliente','');
}
function kpi(n, l, color){
  return '<div class="kpi"><div class="n"' + (color?' style="color:'+color+'"':'') + '>' + n + '</div>' +
         '<div class="l">' + l + '</div></div>';
}

function tarjeta(t){
  const snap = t.licencia_snapshot || {};
  const plaza = [t.estado_republica, snap.municipio].filter(Boolean).join(' · ') || 'sin plaza';
  const sinClas = !t.prioridad_soporte;
  // El desfase entre lo que declaro el cliente y lo que clasificamos es
  // informacion util: se marca en vez de esconderse.
  const desfase = t.prioridad_soporte && t.prioridad_soporte !== t.prioridad;
  const licMala = (snap.activa === false);

  return '<div class="tk ' + (sinClas ? 'sin-clasificar' : 'p-' + escHtml(t.prioridad_soporte)) +
              '" onclick="verDetalle(\'' + t.id + '\')">' +
    '<div class="tk-top">' +
      '<span class="tk-folio">' + escHtml(t.folio) + '</span>' +
      '<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">' +
        '<span class="plaza">' + escHtml(plaza) + '</span>' +
        (licMala ? '<span class="warn-lic">LICENCIA INACTIVA</span>' : '') +
        '<span class="pill e-' + escHtml(t.estado) + '">' + escHtml(ETIQ_ESTADO[t.estado]||t.estado) + '</span>' +
      '</span>' +
    '</div>' +
    '<div class="tk-asunto">' + escHtml(t.asunto) + '</div>' +
    '<div class="tk-meta">' +
      (sinClas ? '<span style="color:var(--purple)">◆ SIN CLASIFICAR</span> · '
               : '<strong>' + escHtml(t.prioridad_soporte).toUpperCase() + '</strong> · ') +
      'cliente dice: ' + '<span' + (desfase?' class="desfase"':'') + '>' + escHtml(t.prioridad) + '</span>' +
      ' · ' + escHtml(t.creador_rol || '—') +
      ' · ' + escHtml(t.categoria) +
      ' · ' + new Date(t.created_at).toLocaleString('es-MX') +
    '</div>' +
  '</div>';
}

/* ── Detalle ────────────────────────────────────────────── */
function volver(){
  document.getElementById('v-detalle').classList.add('oculto');
  document.getElementById('v-bandeja').classList.remove('oculto');
  cargarBandeja();
}

async function verDetalle(id){
  ocultar('dt-err'); ocultar('dt-ok');
  _ticketActual = id;
  document.getElementById('v-bandeja').classList.add('oculto');
  document.getElementById('v-detalle').classList.remove('oculto');
  document.getElementById('dt-cab').innerHTML = '<div class="cargando">Cargando…</div>';
  document.getElementById('dt-hilo').innerHTML = '';

  try {
    const t = (await api('tickets?id=eq.' + id + '&select=*'))[0];
    if (!t) throw new Error('ticket no encontrado');
    const snap = t.licencia_snapshot || {};
    const plaza = [t.estado_republica, snap.municipio].filter(Boolean).join(' · ') || 'sin plaza';

    document.getElementById('dt-cab').innerHTML =
      '<div class="tk-top">' +
        '<span class="tk-folio">' + escHtml(t.folio) + '</span>' +
        '<span class="pill e-' + escHtml(t.estado) + '">' + escHtml(ETIQ_ESTADO[t.estado]||t.estado) + '</span>' +
      '</div>' +
      '<div class="tk-asunto">' + escHtml(t.asunto) + '</div>' +
      '<div class="tk-meta">' +
        escHtml(plaza) + ' · licencia ' + escHtml(snap.clave || '—') +
        (snap.activa === false ? ' · <span style="color:var(--red)">INACTIVA</span>' : '') +
        (snap.fecha_vencimiento ? ' · vence ' + escHtml(snap.fecha_vencimiento) : '') +
        '<br>' + escHtml(t.creador_nombre || '—') + ' (' + escHtml(t.creador_rol || '—') + ')' +
        (t.creador_municipio ? ' · ' + escHtml(t.creador_municipio) : '') +
        (t.creador_seccion ? ' · secc. ' + escHtml(t.creador_seccion) : '') +
        '<br>Abierto ' + new Date(t.created_at).toLocaleString('es-MX') +
        (t.primera_respuesta_at
          ? ' · 1ª respuesta ' + new Date(t.primera_respuesta_at).toLocaleString('es-MX')
          : ' · <span style="color:var(--amber)">sin primera respuesta</span>') +
      '</div>' +
      '<div class="acciones">' +
        '<select class="sel" id="f-clasif" style="width:auto;padding:6px 9px;font-size:12px">' +
          ['critica','alta','media','baja'].map(p =>
            '<option value="'+p+'"' + (t.prioridad_soporte===p?' selected':'') + '>' +
            'Clasificar: ' + p + '</option>').join('') +
        '</select>' +
        '<button class="btn sm" onclick="clasificar()">Guardar prioridad</button>' +
        '<select class="sel" id="f-estado-nuevo" style="width:auto;padding:6px 9px;font-size:12px">' +
          ['asignado','en_proceso','esperando_cliente','resuelto','cerrado'].map(e =>
            '<option value="'+e+'"' + (t.estado===e?' selected':'') + '>' +
            (ETIQ_ESTADO[e]||e) + '</option>').join('') +
        '</select>' +
        '<button class="btn sm" onclick="cambiarEstado()">Cambiar estado</button>' +
      '</div>' +
      (t.prioridad_soporte && t.prioridad_soporte !== t.prioridad
        ? '<div class="tk-meta" style="margin-top:9px;color:var(--amber)">⚠ El cliente lo declaró como ' +
          escHtml(t.prioridad) + '; nosotros lo clasificamos como ' + escHtml(t.prioridad_soporte) + '.</div>'
        : '');

    // Contexto tecnico: es lo primero que mira quien diagnostica.
    const c = t.contexto || {};
    document.getElementById('dt-ctx').textContent =
      'build: ' + (c.build||'—') + '\n' +
      'rol: ' + (c.rol||'—') + ' · municipio: ' + (c.municipio||'—') + ' · sección: ' + (c.seccion||'—') + '\n' +
      'conexión: ' + (c.online === false ? 'SIN CONEXIÓN al momento del reporte' : 'con conexión') + '\n' +
      'módulo: ' + (c.modulo_origen||'—') + ' · pantalla: ' + (c.pantalla||'—') + '\n' +
      'navegador: ' + (c.user_agent||'—') + '\n' +
      'hora del cliente: ' + (c.ts_cliente||'—') + '\n' +
      'errores técnicos recientes:\n' +
      ((c.errores && c.errores.length) ? c.errores.map(e=>'  · '+e).join('\n') : '  (ninguno)');

    const msgs = await api('ticket_mensajes?ticket_id=eq.' + id + '&select=*&order=created_at.asc');
    document.getElementById('dt-hilo').innerHTML = msgs.map(m =>
      '<div class="msg ' + (m.interno ? 'interno' : (m.autor_tipo==='soporte'?'soporte':'cliente')) + '">' +
        '<div class="msg-head">' +
          (m.interno ? '🔒 NOTA INTERNA · ' : '') +
          (m.autor_tipo==='soporte' ? '🛠 ' : '👤 ') + escHtml(m.autor_nombre||'—') +
          ' · ' + new Date(m.created_at).toLocaleString('es-MX') +
        '</div>' + escHtml(m.cuerpo) +
      '</div>'
    ).join('');

    const adj = await api('ticket_adjuntos?ticket_id=eq.' + id + '&select=nombre_archivo,storage_path');
    if (adj.length) {
      document.getElementById('dt-hilo').insertAdjacentHTML('beforeend',
        '<div class="card"><label class="lbl">Adjuntos</label>' +
        adj.map(a => '<div style="margin-top:5px"><button class="btn sm" onclick="abrirAdjunto(\'' +
          escHtml(a.storage_path) + '\')">📎 ' + escHtml(a.nombre_archivo) + '</button></div>').join('') +
        '</div>');
    }
  } catch(e) {
    document.getElementById('dt-cab').innerHTML = '';
    mostrar('dt-err','No se pudo abrir el ticket: ' + e.message);
  }
}

// El bucket es privado: no hay URL publica. Se pide una firmada, valida 60 s.
async function abrirAdjunto(ruta){
  try {
    const r = await sFetch(SUPA_URL + '/storage/v1/object/sign/ticket-adjuntos/' + ruta, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ expiresIn: 60 })
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    window.open(SUPA_URL + '/storage/v1' + d.signedURL, '_blank');
  } catch(e) {
    mostrar('dt-err','No se pudo abrir el adjunto: ' + e.message);
  }
}

async function clasificar(){
  ocultar('dt-err');
  const p = document.getElementById('f-clasif').value;
  try {
    await rpc('clasificar_ticket', { p_ticket_id:_ticketActual, p_prioridad:p });
    mostrar('dt-ok','Clasificado como ' + p + '.', 2500);
    await verDetalle(_ticketActual);
  } catch(e) { mostrar('dt-err','No se pudo clasificar: ' + e.message); }
}

async function cambiarEstado(){
  ocultar('dt-err');
  const e = document.getElementById('f-estado-nuevo').value;
  try {
    await rpc('cambiar_estado_ticket', { p_ticket_id:_ticketActual, p_estado:e });
    mostrar('dt-ok','Estado actualizado.', 2500);
    await verDetalle(_ticketActual);
  } catch(err) { mostrar('dt-err','No se pudo cambiar el estado: ' + err.message); }
}

async function responder(interno){
  ocultar('dt-err');
  const txt = document.getElementById('f-resp').value.trim();
  if (txt.length < 2) { mostrar('dt-err','Escribe la respuesta antes de enviarla.'); return; }
  const btn = document.getElementById('btn-resp');
  if (btn.disabled) return;
  btn.disabled = true;
  try {
    await rpc('agregar_mensaje_ticket', { p_ticket_id:_ticketActual, p_cuerpo:txt, p_interno:!!interno });
    document.getElementById('f-resp').value = '';   // solo tras el exito
    await verDetalle(_ticketActual);
  } catch(e) {
    mostrar('dt-err','No se pudo enviar: ' + e.message);
  } finally { btn.disabled = false; }
}

/* ── Arranque: si ya hay sesión guardada, entrar directo ── */
(async function init(){
  const s = leerSesion();
  if (!s || !s.access_token) return;
  _ses = s;
  try {
    const esSop = await rpc('es_soporte');
    if (esSop === true) { await arrancarApp(); return; }
  } catch(e) {}
  // Sesión vencida o cuenta ya sin permiso: de vuelta al login, sin ruido.
  localStorage.removeItem(SESION_KEY);
  _ses = null;
})();
</script>
